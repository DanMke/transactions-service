name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Testcontainers uses the Docker daemon that is already running on the
      # ubuntu-latest runner, so no extra services are required here.
      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon
