name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Testcontainers uses the Docker daemon that is already running on the
      # ubuntu-latest runner, so no extra services are required here.
      # `build` also runs the JaCoCo coverage report and enforces the coverage
      # thresholds via jacocoTestCoverageVerification (wired into `check`).
      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test
          retention-days: 14
